<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR ตัวอย่าง</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#0f1424;color:#e8ecf7;display:flex;flex-direction:column;min-height:100vh}
  h1{font-size:20px;margin:20px 20px 4px}
  p{margin:0 20px 12px;color:#aab3cf;font-size:14px}
  model-viewer{flex:1;width:100%;min-height:65vh;background:radial-gradient(circle at 50% 35%,#27305a,#0f1424 70%)}
  .ar-btn{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#ffd166;color:#1b1f33;border:0;border-radius:999px;padding:14px 24px;font-size:16px;font-weight:700}
</style>
</head>
<body>
<h1>ลองวางโมเดล 3D ในห้องของคุณ</h1>
<p>กดปุ่มเหลือง แล้วอนุญาตการใช้กล้อง ส่องไปที่พื้นหรือโต๊ะ</p>
<model-viewer
  src="https://cdn.jsdelivr.net/gh/google/model-viewer@master/packages/shared-assets/models/Astronaut.glb"
  alt="โมเดล 3D นักบินอวกาศ"
  camera-controls auto-rotate shadow-intensity="1"
  ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor">
  <button slot="ar-button" class="ar-btn">ดูในพื้นที่จริง (AR)</button>
</model-viewer>
</body>
</html>
